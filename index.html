<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Stable AI Edition</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>

  <!-- 順序・依存関係を完全に担保した単一構成バンドル -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">AIモデルを初期化中...</div>
      <div id="ball-info">しばらくお待ちください</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let model = null;
    let smoothX = null, smoothY = null, smoothR = null;
    const SMOOTHING = 0.35;

    async function initAI() {
      try {
        statusEl.innerText = "AIエンジン読み込み中...";
        // tfjsの準備完了を確実に待機
        await tf.ready();
        
        // 軽量なCOCO-SSDモデルのロード
        model = await cocoSsd.load();
        statusEl.innerText = "AI準備完了！カメラを起動します";
        startCamera();
      } catch (err) {
        statusEl.innerText = "AIロード失敗: " + err.message;
        statusEl.style.color = "#ff4d4d";
      }
    }

    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        statusEl.innerText = "リアルタイムAI追跡起動";
        detectFrame();
      } else {
        statusEl.innerText = "カメラの起動に失敗しました";
        statusEl.style.color = "#ff4d4d";
      }
    }

    async function detectFrame() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;

      if (model && video.readyState >= 2) {
        try {
          const predictions = await model.detect(video, 5, 0.25);
          
          // 「sports ball」または「ball」オブジェクトを認識
          const ball = predictions.find(p => p.class === 'sports ball' || p.class === 'ball');

          if (ball) {
            const [bx, by, bw, bh] = ball.bbox;
            const rawX = bx + bw / 2;
            const rawY = by + bh / 2;
            const rawR = Math.max(bw, bh) / 2;

            if (smoothX === null) {
              smoothX = rawX; smoothY = rawY; smoothR = rawR;
            } else {
              smoothX += (rawX - smoothX) * SMOOTHING;
              smoothY += (rawY - smoothY) * SMOOTHING;
              smoothR += (rawR - smoothR) * SMOOTHING;
            }
            ballInfoEl.innerText = `ボールAI検出中 (${Math.round(ball.score * 100)}%)`;
          } else {
            smoothX = null;
            ballInfoEl.innerText = "バスケットボールを画面内に映してください";
          }
        } catch (e) {
          console.error(e);
        }
      }

      drawAR();
      requestAnimationFrame(detectFrame);
    }

    function drawAR() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 投球ガイドライン
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      // AI認識枠
      if (smoothX !== null) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(smoothX, smoothY, smoothR, 0, Math.PI * 2);
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(smoothX, smoothY, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#00FFFF';
        ctx.fill();
      }
    }

    initAI();
  </script>
</body>
</html>
