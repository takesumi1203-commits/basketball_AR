<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Tap Lock Edition</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">カメラ起動完了</div>
      <div id="ball-info">【操作】画面上のボールをタップしてロックオン！</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const sampleCanvas = document.createElement('canvas');
    const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

    // ロックオン用の色ターゲット（RGB）
    let targetRGB = null;

    let smoothX = null;
    let smoothY = null;
    let smoothR = null;
    const SMOOTHING_FACTOR = 0.3;

    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        requestAnimationFrame(processLoop);
      }
    }

    // タップ位置の色を取得してターゲットに設定
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const w = sampleCanvas.width || 120;
      const h = sampleCanvas.height || 90;

      const scaleX = w / canvas.width;
      const scaleY = h / canvas.height;

      const sampleX = Math.floor(clickX * scaleX);
      const sampleY = Math.floor(clickY * scaleY);

      const pixelData = sampleCtx.getImageData(sampleX, sampleY, 1, 1).data;
      targetRGB = { r: pixelData[0], g: pixelData[1], b: pixelData[2] };

      statusEl.innerText = "ボールの色をロックオンしました！";
      statusEl.style.color = "#00ffff";
    });

    function detectBallColor() {
      const w = 120;
      const h = Math.floor(video.videoHeight * (w / video.videoWidth)) || 90;
      sampleCanvas.width = w;
      sampleCanvas.height = h;

      sampleCtx.drawImage(video, 0, 0, w, h);
      const imgData = sampleCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      if (!targetRGB) return; // タップされるまで処理保留

      let sumX = 0, sumY = 0, count = 0;
      let minX = w, maxX = 0, minY = h, maxY = 0;

      const TOLERANCE = 45; // 色の許容誤差

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // ロックオンした色とのユークリッド距離計算
        const diffR = Math.abs(r - targetRGB.r);
        const diffG = Math.abs(g - targetRGB.g);
        const diffB = Math.abs(b - targetRGB.b);

        if (diffR < TOLERANCE && diffG < TOLERANCE && diffB < TOLERANCE) {
          const pixelIdx = i / 4;
          const x = pixelIdx % w;
          const y = Math.floor(pixelIdx / w);

          sumX += x;
          sumY += y;
          count++;

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }

      if (count > 12) {
        const avgX = sumX / count;
        const avgY = sumY / count;

        const scaleX = canvas.width / w;
        const scaleY = canvas.height / h;

        const rawX = avgX * scaleX;
        const rawY = avgY * scaleY;
        const rawR = Math.max(((maxX - minX) * scaleX) / 2, 25);

        if (smoothX === null) {
          smoothX = rawX;
          smoothY = rawY;
          smoothR = rawR;
        } else {
          smoothX += (rawX - smoothX) * SMOOTHING_FACTOR;
          smoothY += (rawY - smoothY) * SMOOTHING_FACTOR;
          smoothR += (rawR - smoothR) * SMOOTHING_FACTOR;
        }

        ballInfoEl.innerText = `追跡中 (X:${Math.round(smoothX)}, Y:${Math.round(smoothY)})`;
      } else {
        ballInfoEl.innerText = "ターゲット喪失：画面上のボールを再度タップしてください";
      }
    }

    function processLoop() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (video.readyState >= 2) {
        detectBallColor();
      }

      drawAR();
      requestAnimationFrame(processLoop);
    }

    function drawAR() {
      // 投球ガイドライン
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      // ボール追跡枠
      if (smoothX !== null && targetRGB) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(smoothX, smoothY, smoothR, 0, Math.PI * 2);
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(smoothX, smoothY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#00FFFF';
        ctx.fill();
      }
    }

    startCamera();
  </script>
</body>
</html>
