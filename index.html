<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Stable Color Edition</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">カメラ起動中...</div>
      <div id="ball-info">ボールを探しています</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const sampleCanvas = document.createElement('canvas');
    const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

    // スムージング（手ブレ補正）用の変数
    let smoothX = null;
    let smoothY = null;
    let smoothR = null;
    const SMOOTHING_FACTOR = 0.25; // 値が小さいほど動きが滑らか（追従は少し緩やか）

    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        statusEl.style.color = "#00ff66";
        statusEl.innerText = "カメラ起動完了！";
        requestAnimationFrame(processLoop);
      } else {
        statusEl.style.color = "#ff4d4d";
        statusEl.innerText = "カメラアクセス失敗";
      }
    }

    function detectBallColor() {
      const w = 120; // 処理速度向上のため軽量化
      const h = Math.floor(video.videoHeight * (w / video.videoWidth)) || 90;
      sampleCanvas.width = w;
      sampleCanvas.height = h;

      sampleCtx.drawImage(video, 0, 0, w, h);
      const imgData = sampleCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      let sumX = 0, sumY = 0, count = 0;
      let minX = w, maxX = 0, minY = h, maxY = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // バスケットボール特有のオレンジ色判定（厳格化）
        if (r > 160 && g > 50 && g < 130 && b < 70 && (r - g) > 50) {
          const pixelIdx = i / 4;
          const x = pixelIdx % w;
          const y = Math.floor(pixelIdx / w);

          sumX += x;
          sumY += y;
          count++;

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }

      // ある程度の大きさがあり、かつ縦横比が正方形に近い（丸い）場合のみ判定
      const boxW = maxX - minX;
      const boxH = maxY - minY;
      const aspectRatio = boxW / (boxH || 1);

      if (count > 25 && aspectRatio > 0.6 && aspectRatio < 1.4) {
        const avgX = sumX / count;
        const avgY = sumY / count;

        const scaleX = canvas.width / w;
        const scaleY = canvas.height / h;

        const rawX = avgX * scaleX;
        const rawY = avgY * scaleY;
        const rawR = Math.max((boxW * scaleX) / 2, 20);

        // スムージング処理（位置のブレを抑制）
        if (smoothX === null) {
          smoothX = rawX;
          smoothY = rawY;
          smoothR = rawR;
        } else {
          smoothX += (rawX - smoothX) * SMOOTHING_FACTOR;
          smoothY += (rawY - smoothY) * SMOOTHING_FACTOR;
          smoothR += (rawR - smoothR) * SMOOTHING_FACTOR;
        }

        ballInfoEl.innerText = `ボール検出中 (X:${Math.round(smoothX)}, Y:${Math.round(smoothY)})`;
      } else {
        // 検出されなかった場合はゆっくりリセット
        smoothX = null;
        smoothY = null;
        smoothR = null;
        ballInfoEl.innerText = "オレンジ色のボールを探しています";
      }
    }

    function processLoop() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (video.readyState >= 2) {
        detectBallColor();
      }

      drawAR();
      requestAnimationFrame(processLoop);
    }

    function drawAR() {
      // 投球ガイドライン
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      // ボール追跡枠（スムーズ化後）
      if (smoothX !== null) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(smoothX, smoothY, smoothR, 0, Math.PI * 2);
        ctx.strokeStyle = '#FF6600';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(smoothX, smoothY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#FF6600';
        ctx.fill();
      }
    }

    startCamera();
  </script>
</body>
</html>
