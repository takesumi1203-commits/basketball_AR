<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Goal & Trajectory Compare</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 300px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">画面上の「ゴール（リング）」をタップして設置してください</div>
      <div id="ball-info">ボール認識準備中...</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let model = null;
    let smoothX = null, smoothY = null, smoothR = null;
    const SMOOTHING = 0.5;

    // ゴールリングのAR位置 (X, Y)
    let rimX = null;
    let rimY = null;

    const posHistory = [];
    const MAX_HISTORY = 4;
    let velocityX = 0;
    let velocityY = 0;

    async function initAI() {
      try {
        await tf.ready();
        model = await cocoSsd.load();
        startCamera();
      } catch (err) {
        statusEl.innerText = "AIロード失敗: " + err.message;
        statusEl.style.color = "#ff4d4d";
      }
    }

    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        detectFrame();
      }
    }

    // 画面タップでゴールの位置（リング）を固定設置
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      rimX = e.clientX - rect.left;
      rimY = e.clientY - rect.top;

      statusEl.innerText = "ARゴールを設置しました！緑（実軌道）と水色（最適軌道）を合わせてください";
      statusEl.style.color = "#00ffff";
    });

    async function detectFrame() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;

      if (model && video.readyState >= 2) {
        try {
          const predictions = await model.detect(video, 5, 0.25);
          const ball = predictions.find(p => p.class === 'sports ball' || p.class === 'ball');

          if (ball) {
            const [bx, by, bw, bh] = ball.bbox;
            const rawX = bx + bw / 2;
            const rawY = by + bh / 2;
            const rawR = Math.max(bw, bh) / 2;

            if (smoothX === null) {
              smoothX = rawX; smoothY = rawY; smoothR = rawR;
            } else {
              smoothX += (rawX - smoothX) * SMOOTHING;
              smoothY += (rawY - smoothY) * SMOOTHING;
              smoothR += (rawR - smoothR) * SMOOTHING;
            }

            const now = performance.now();
            posHistory.push({ x: smoothX, y: smoothY, time: now });
            if (posHistory.length > MAX_HISTORY) posHistory.shift();

            calculateVelocity();

            ballInfoEl.innerText = `ボール検出中 | ゴール再設定は画面を再タップ`;
          } else {
            smoothX = null;
            posHistory.length = 0;
            velocityX = 0;
            velocityY = 0;
            ballInfoEl.innerText = "バスケットボールを画面内に映してください";
          }
        } catch (e) {}
      }

      drawAR();
      requestAnimationFrame(detectFrame);
    }

    function calculateVelocity() {
      if (posHistory.length < 2) return;
      const oldest = posHistory[0];
      const newest = posHistory[posHistory.length - 1];
      const dt = (newest.time - oldest.time) / 1000;

      if (dt > 0) {
        velocityX = ((newest.x - oldest.x) / dt) * 2.2;
        velocityY = ((newest.y - oldest.y) / dt) * 2.2;
      }
    }

    function drawAR() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. ARゴールリングの描画
      if (rimX !== null && rimY !== null) {
        // バックボード
        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.fillRect(rimX - 40, rimY - 50, 80, 50);
        ctx.strokeRect(rimX - 40, rimY - 50, 80, 50);

        // リング（赤オレンジ）
        ctx.beginPath();
        ctx.ellipse(rimX, rimY, 35, 12, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#FF5722';
        ctx.lineWidth = 6;
        ctx.stroke();
      }

      // 2. ボールと軌道の描画
      if (smoothX !== null) {
        // ボール検出枠
        ctx.beginPath();
        ctx.arc(smoothX, smoothY, smoothR, 0, Math.PI * 2);
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 4;
        ctx.stroke();

        // 【最適軌道（水跡）】ボールからリングへの理想的な放物線
        if (rimX !== null && rimY !== null) {
          drawOptimalTrajectory(smoothX, smoothY, rimX, rimY);
        }

        // 【実際の予測軌道（緑色）】現在のボールの動きに基づく軌道
        drawActualTrajectory(smoothX, smoothY, velocityX, velocityY);
      }
    }

    // 理想的な成功軌道（2次ベジェ曲線による水色の弧）
    function drawOptimalTrajectory(sx, sy, tx, ty) {
      ctx.beginPath();
      ctx.strokeStyle = '#00FFFF'; // 水色
      ctx.lineWidth = 4;
      ctx.setLineDash([4, 4]);

      // ボールとゴールの高低差に応じた最高の頂点を計算（きれいな高弧を描く）
      const midX = (sx + tx) / 2;
      const peakY = Math.min(sy, ty) - Math.abs(sx - tx) * 0.4; 

      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(midX, peakY, tx, ty);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 実際のボール速度から計算される動的放物線（緑色）
    function drawActualTrajectory(startX, startY, vx, vy) {
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66'; // 緑色
      ctx.lineWidth = 5;
      ctx.setLineDash([8, 6]);

      let currX = startX;
      let currY = startY;

      let simVx = (Math.abs(vx) < 50) ? (rimX ? (rimX - startX) * 0.8 : 250) : vx;
      let simVy = (Math.abs(vy) < 50) ? -550 : vy;

      const gravity = 1100;
      const step = 0.03;
      const totalSteps = 30;

      ctx.moveTo(currX, currY);

      for (let i = 0; i < totalSteps; i++) {
        simVy += gravity * step;
        currX += simVx * step;
        currY += simVy * step;

        ctx.lineTo(currX, currY);
        if (currX < 0 || currX > canvas.width || currY > canvas.height) break;
      }

      ctx.stroke();
      ctx.setLineDash([]);
    }

    initAI();
  </script>
</body>
</html>
