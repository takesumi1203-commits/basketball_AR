<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Sensitive Trajectory</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">AIモデルを初期化中...</div>
      <div id="ball-info">しばらくお待ちください</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let model = null;
    let smoothX = null, smoothY = null, smoothR = null;
    const SMOOTHING = 0.5; // スムージングを少し弱めて応答性を向上

    const posHistory = [];
    const MAX_HISTORY = 4; // 直近4フレームで鋭く速度を感知

    let velocityX = 0;
    let velocityY = 0;

    async function initAI() {
      try {
        statusEl.innerText = "AIエンジン読み込み中...";
        await tf.ready();
        model = await cocoSsd.load();
        statusEl.innerText = "AI準備完了！カメラを起動します";
        startCamera();
      } catch (err) {
        statusEl.innerText = "AIロード失敗: " + err.message;
        statusEl.style.color = "#ff4d4d";
      }
    }

    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        statusEl.innerText = "高感度トラッキング起動中";
        detectFrame();
      }
    }

    async function detectFrame() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;

      if (model && video.readyState >= 2) {
        try {
          const predictions = await model.detect(video, 5, 0.25);
          const ball = predictions.find(p => p.class === 'sports ball' || p.class === 'ball');

          if (ball) {
            const [bx, by, bw, bh] = ball.bbox;
            const rawX = bx + bw / 2;
            const rawY = by + bh / 2;
            const rawR = Math.max(bw, bh) / 2;

            if (smoothX === null) {
              smoothX = rawX; smoothY = rawY; smoothR = rawR;
            } else {
              smoothX += (rawX - smoothX) * SMOOTHING;
              smoothY += (rawY - smoothY) * SMOOTHING;
              smoothR += (rawR - smoothR) * SMOOTHING;
            }

            const now = performance.now();
            posHistory.push({ x: smoothX, y: smoothY, time: now });
            if (posHistory.length > MAX_HISTORY) posHistory.shift();

            calculateVelocity();

            ballInfoEl.innerText = `検出中 (Vx: ${Math.round(velocityX)}, Vy: ${Math.round(velocityY)})`;
          } else {
            smoothX = null;
            posHistory.length = 0;
            velocityX = 0;
            velocityY = 0;
            ballInfoEl.innerText = "バスケットボールを画面内に映してください";
          }
        } catch (e) {
          console.error(e);
        }
      }

      drawAR();
      requestAnimationFrame(detectFrame);
    }

    function calculateVelocity() {
      if (posHistory.length < 2) return;
      const oldest = posHistory[0];
      const newest = posHistory[posHistory.length - 1];
      const dt = (newest.time - oldest.time) / 1000;

      if (dt > 0) {
        // 動きの感度倍率（2.2倍）をかけて鋭く反応させる
        velocityX = ((newest.x - oldest.x) / dt) * 2.2;
        velocityY = ((newest.y - oldest.y) / dt) * 2.2;
      }
    }

    function drawAR() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (smoothX !== null) {
        // ボール枠
        ctx.beginPath();
        ctx.arc(smoothX, smoothY, smoothR, 0, Math.PI * 2);
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 4;
        ctx.stroke();

        // 軌道描画
        drawDynamicTrajectory(smoothX, smoothY, velocityX, velocityY);
      }
    }

    function drawDynamicTrajectory(startX, startY, vx, vy) {
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 5; // 視認性を高めるため線を太く
      ctx.setLineDash([8, 6]);

      let currX = startX;
      let currY = startY;

      // 停止時のデフォルト仰角（ふんわり上向き）
      let simVx = (Math.abs(vx) < 50) ? 300 : vx;
      let simVy = (Math.abs(vy) < 50) ? -550 : vy;

      const gravity = 1100; // 重力感度
      const step = 0.03;
      const totalSteps = 30;

      ctx.moveTo(currX, currY);

      for (let i = 0; i < totalSteps; i++) {
        simVy += gravity * step;
        currX += simVx * step;
        currY += simVy * step;

        ctx.lineTo(currX, currY);

        if (currX < 0 || currX > canvas.width || currY > canvas.height) break;
      }

      ctx.stroke();
      ctx.setLineDash([]);
    }

    initAI();
  </script>
</body>
</html>
