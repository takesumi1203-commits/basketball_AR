<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; text-align: center; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">カメラ読み込み中...</div>
      <button onclick="sendData()">データを記録テスト</button>
    </div>
  </div>

  <script>
    // ★ここにStep 1で取得したGASのWebアプリURLを貼り付け
    const GAS_API_URL = "https://script.google.com/macros/s/YOUR_GAS_DEPLOYMENT_ID/exec";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // カメラ起動処理（iPhoneのSafariでも1発で動きます）
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        document.getElementById('status').innerText = "ARガイド表示中";
        requestAnimationFrame(draw);
      } catch (err) {
        document.getElementById('status').innerText = "カメラエラー: " + err.message;
      }
    }

    // ARガイドライン描画
    function draw() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 手本の放物線
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.2, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      requestAnimationFrame(draw);
    }

    // GAS APIへデータ送信
    async function sendData() {
      document.getElementById('status').innerText = "送信中...";
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors', // GASへのCORSエラー回避
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ angleError: 1.8, score: 92 })
        });
        document.getElementById('status').innerText = "記録完了！";
      } catch (err) {
        document.getElementById('status').innerText = "送信失敗: " + err.message;
      }
    }

    initCamera();
  </script>
</body>
</html>
