<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - AI Detection</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
  <!-- Google公式の安定したCDNからMediaPipe Objectron/Visionをロード -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">AIモデルをロード中...</div>
      <div id="ball-info">しばらくお待ちください</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let model = null;
    let ballPosition = null;

    // 位置補正用（スムーズな追従）
    let smoothX = null, smoothY = null, smoothR = null;
    const SMOOTHING = 0.4;

    async function initAI() {
      try {
        // 軽量なCOCO-SSDモデルをロード（スポーツボール認識対応）
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        statusEl.innerText = "AIの準備完了！カメラを起動します";
        startCamera();
      } catch (err) {
        statusEl.innerText = "AIロード失敗: " + err.message;
        statusEl.style.color = "#ff4d4d";
      }
    }

    async function startCamera() {
      const constraints = { video: { facingMode: "environment" }, audio: false };
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        statusEl.innerText = "リアルタイムAI追跡中";
        detectFrame();
      } catch (e) {
        // インカメラ fallback
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = stream;
          await video.play();
          statusEl.innerText = "リアルタイムAI追跡中";
          detectFrame();
        } catch(err) {
          statusEl.innerText = "カメラ起動失敗";
        }
      }
    }

    async function detectFrame() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;

      if (model && video.readyState === 4) {
        const predictions = await model.detect(video, 5, 0.3);
        
        // 「sports ball」または「ball」として判定されたオブジェクトを探す
        const ball = predictions.find(p => p.class === 'sports ball' || p.class === 'ball');

        if (ball) {
          const [bx, by, bw, bh] = ball.bbox;
          const rawX = bx + bw / 2;
          const rawY = by + bh / 2;
          const rawR = Math.max(bw, bh) / 2;

          if (smoothX === null) {
            smoothX = rawX; smoothY = rawY; smoothR = rawR;
          } else {
            smoothX += (rawX - smoothX) * SMOOTHING;
            smoothY += (rawY - smoothY) * SMOOTHING;
            smoothR += (rawR - smoothR) * SMOOTHING;
          }
          ballInfoEl.innerText = `ボールAI認識中 (${Math.round(ball.score * 100)}%)`;
        } else {
          smoothX = null;
          ballInfoEl.innerText = "ボールを画面内に映してください";
        }
      }

      drawAR();
      requestAnimationFrame(detectFrame);
    }

    function drawAR() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ガイドライン描画
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      // AI認識枠描画
      if (smoothX !== null) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(smoothX, smoothY, smoothR, 0, Math.PI * 2);
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(smoothX, smoothY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#00FFFF';
        ctx.fill();
      }
    }

    initAI();
  </script>
</body>
</html>
