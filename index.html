<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Stable</title>
  <!-- 安定版のMediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; word-break: break-all; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">カメラ起動中...</div>
      <div id="ball-info">AI初期化準備中</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let objectDetector = null;
    let lastVideoTime = -1;
    let ballPosition = null;

    window.onerror = function(msg, url, lineNo) {
      statusEl.style.color = "#ff4d4d";
      statusEl.innerText = "エラー: " + msg + " (行:" + lineNo + ")";
      return false;
    };

    // 1. カメラ起動処理
    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        statusEl.style.color = "#00ff66";
        statusEl.innerText = "カメラ起動完了！AIロード待ち...";
        requestAnimationFrame(drawLoop);
        
        loadMediaPipeWithRetry();
      } else {
        statusEl.style.color = "#ff4d4d";
        statusEl.innerText = "カメラアクセス失敗";
      }
    }

    // 2. リトライ機能付きMediaPipe初期化
    async function loadMediaPipeWithRetry(retries = 5) {
      for (let i = 1; i <= retries; i++) {
        try {
          ballInfoEl.innerText = `AIデータ受信中... (${i}/${retries})`;
          
          if (!window.tasksVision) {
            await new Promise(resolve => setTimeout(resolve, 1000));
            if (!window.tasksVision) throw new Error("ライブラリ未読み込み");
          }

          const { ObjectDetector, FilesetResolver } = window.tasksVision;
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
          );
          
          objectDetector = await ObjectDetector.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
              delegate: "GPU"
            },
            scoreThreshold: 0.3,
            runningMode: "VIDEO"
          });

          statusEl.innerText = "AR・AIリアルタイム追跡中";
          ballInfoEl.innerText = "ボール未検出";
          return; // 成功したら脱出

        } catch (err) {
          console.warn(`試行 ${i} 失敗:`, err);
          if (i === retries) {
            ballInfoEl.style.color = "#ff4d4d";
            ballInfoEl.innerText = "通信環境をお確かめの上、再読み込みしてください。";
          } else {
            await new Promise(resolve => setTimeout(resolve, 2000)); // 2秒待って再試行
          }
        }
      }
    }

    // 3. メイン描画・推論ループ
    async function drawLoop() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (objectDetector && video.currentTime !== lastVideoTime && video.readyState >= 2) {
        lastVideoTime = video.currentTime;
        try {
          const detections = await objectDetector.detectForVideo(video, performance.now());
          const sportsBall = detections.detections.find(d => 
            d.categories.some(c => c.categoryName === "sports ball")
          );

          if (sportsBall) {
            const bb = sportsBall.boundingBox;
            const scaleX = canvas.width / video.videoWidth;
            const scaleY = canvas.height / video.videoHeight;

            ballPosition = {
              x: (bb.originX + bb.width / 2) * scaleX,
              y: (bb.originY + bb.height / 2) * scaleY,
              radius: (Math.max(bb.width, bb.height) / 2) * scaleX
            };
            ballInfoEl.innerText = `ボール検出！ (X:${Math.round(ballPosition.x)}, Y:${Math.round(ballPosition.y)})`;
          } else {
            ballPosition = null;
            ballInfoEl.innerText = "ボール未検出";
          }
        } catch (e) {
          console.warn("推論エラー:", e);
        }
      }

      drawAR();
      requestAnimationFrame(drawLoop);
    }

    // 4. AR描画
    function drawAR() {
      // ガイドライン（緑）
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      // ボール追跡枠（オレンジ）
      if (ballPosition) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(ballPosition.x, ballPosition.y, ballPosition.radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#FF6600';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ballPosition.x, ballPosition.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#FF6600';
        ctx.fill();
      }
    }

    startCamera();
  </script>
</body>
</html>
