<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Debug</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; word-break: break-all; }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">初期化スタート...</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 画面上にJavaScriptエラーを直接書き出す処理
    window.onerror = function(msg, url, lineNo) {
      statusEl.style.color = "#ff4d4d";
      statusEl.innerText = "JSエラー: " + msg + " (行:" + lineNo + ")";
      return false;
    };

    // 段階的にカメラ取得を試みる安全な関数
    async function startCamera() {
      statusEl.innerText = "Step 1: カメラアクセス要求中...";

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.style.color = "#ff4d4d";
        statusEl.innerText = "エラー: お使いのブラウザはカメラ機能に対応していません";
        return;
      }

      // 取得条件の候補（条件が緩い順に試す）
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      let lastErr = null;

      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {
          lastErr = e;
        }
      }

      if (stream) {
        statusEl.innerText = "Step 2: 映像ストリーム設定中...";
        video.srcObject = stream;
        
        try {
          await video.play();
          statusEl.style.color = "#00ff66";
          statusEl.innerText = "カメラ起動完了！画面描画中...";
          requestAnimationFrame(drawLoop);
        } catch (playErr) {
          statusEl.style.color = "#ffcc00";
          statusEl.innerText = "再生エラー: " + playErr.message + " (タップして再生)";
          // 画面タップで強制再生するイベントリスナー
          document.body.addEventListener('click', () => {
            video.play();
            statusEl.innerText = "カメラ起動完了！";
            requestAnimationFrame(drawLoop);
          }, { once: true });
        }
      } else {
        statusEl.style.color = "#ff4d4d";
        statusEl.innerText = "カメラ取得失敗: " + (lastErr ? lastErr.message : "不明なエラー");
      }
    }

    // 簡易AR描画ループ
    function drawLoop() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ガイド用点線
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      requestAnimationFrame(drawLoop);
    }

    // 起動
    startCamera();
  </script>
</body>
</html>
