<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Free Throw Trainer - Stable Light Edition</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.85); 
      padding: 12px 20px; 
      border-radius: 10px; 
      text-align: center;
      min-width: 280px;
      z-index: 999;
    }
    #status { font-size: 13px; font-weight: bold; color: #00ff66; word-break: break-all; }
    #ball-info { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="status">カメラ起動中...</div>
      <div id="ball-info">オレンジ色のボールを探しています</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const ballInfoEl = document.getElementById('ball-info');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // カラー分析用キャンバス
    const sampleCanvas = document.createElement('canvas');
    const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

    let ballPosition = null;

    window.onerror = function(msg, url, lineNo) {
      statusEl.style.color = "#ff4d4d";
      statusEl.innerText = "エラー: " + msg;
      return false;
    };

    // 1. カメラ起動
    async function startCamera() {
      const constraintsList = [
        { video: { facingMode: "environment" }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      for (let constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {}
      }

      if (stream) {
        video.srcObject = stream;
        await video.play();
        statusEl.style.color = "#00ff66";
        statusEl.innerText = "カメラ・リアルタイムAR起動完了！";
        requestAnimationFrame(processLoop);
      } else {
        statusEl.style.color = "#ff4d4d";
        statusEl.innerText = "カメラアクセス失敗";
      }
    }

    // 2. 高速カラー検出処理（バスケットボールのオレンジ色を追跡）
    function detectBallColor() {
      const w = 160; // 処理軽量化のために低解像度化
      const h = Math.floor(video.videoHeight * (w / video.videoWidth)) || 120;
      sampleCanvas.width = w;
      sampleCanvas.height = h;

      sampleCtx.drawImage(video, 0, 0, w, h);
      const imgData = sampleCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      let sumX = 0, sumY = 0, count = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // オレンジ色・赤茶色の色域判定 (RGB)
        if (r > 150 && g > 60 && g < 140 && b < 80 && (r - g) > 40) {
          const pixelIdx = i / 4;
          sumX += pixelIdx % w;
          sumY += Math.floor(pixelIdx / w);
          count++;
        }
      }

      if (count > 15) { // 規定ピクセル数以上あれば検出とみなす
        const avgX = sumX / count;
        const avgY = sumY / count;
        
        const scaleX = canvas.width / w;
        const scaleY = canvas.height / h;

        ballPosition = {
          x: avgX * scaleX,
          y: avgY * scaleY,
          radius: Math.min(Math.sqrt(count) * 2.5, 60)
        };
        ballInfoEl.innerText = `ボール検出中 (X:${Math.round(ballPosition.x)}, Y:${Math.round(ballPosition.y)})`;
      } else {
        ballPosition = null;
        ballInfoEl.innerText = "オレンジ色のボールを探しています";
      }
    }

    // 3. ループ処理
    function processLoop() {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (video.readyState >= 2) {
        detectBallColor();
      }

      drawAR();
      requestAnimationFrame(processLoop);
    }

    // 4. AR描画
    function drawAR() {
      // 投球ガイドライン（緑の破線）
      ctx.beginPath();
      ctx.strokeStyle = '#00FF66';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.moveTo(canvas.width * 0.15, canvas.height * 0.8);
      ctx.quadraticCurveTo(canvas.width * 0.5, canvas.height * 0.2, canvas.width * 0.85, canvas.height * 0.45);
      ctx.stroke();

      // ボール追跡枠（オレンジの円）
      if (ballPosition) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(ballPosition.x, ballPosition.y, ballPosition.radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#FF6600';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ballPosition.x, ballPosition.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#FF6600';
        ctx.fill();
      }
    }

    startCamera();
  </script>
</body>
</html>
